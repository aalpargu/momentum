name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Üretim bağımlılıklarını güvenlik açısından denetle
        run: npm audit --omit=dev --audit-level=high
      - name: Test, tip kontrolü ve production build
        run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: Node.js kur
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Chromium, Firefox ve WebKit kur
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Kritik kullanıcı akışlarını tüm tarayıcılarda çalıştır
        run: npm run test:e2e
