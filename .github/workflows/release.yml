name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: tar -czf momentum-web.tar.gz dist
      - name: GitHub sürümünü oluştur
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: momentum-web.tar.gz
