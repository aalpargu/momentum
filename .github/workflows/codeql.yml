name: CodeQL güvenlik taraması

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: JavaScript ve TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v6
      - name: CodeQL başlat
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Uygulamayı oluştur
        uses: github/codeql-action/autobuild@v4
      - name: Analizi tamamla
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
