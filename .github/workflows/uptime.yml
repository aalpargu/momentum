name: Ücretsiz canlılık kontrolü

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Uygulama kabuğunu doğrula
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 2 \
            https://momentum-kappa-sepia.vercel.app/ > /dev/null
      - name: Gizlilik ve destek sayfalarını doğrula
        run: |
          curl --fail --silent --show-error --location --max-time 20 --retry 2 \
            https://momentum-kappa-sepia.vercel.app/privacy.html > /dev/null
          curl --fail --silent --show-error --location --max-time 20 --retry 2 \
            https://momentum-kappa-sepia.vercel.app/support.html > /dev/null
      - name: Supabase fonksiyonunun kimlik doğrulamayı zorunlu tuttuğunu doğrula
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \
            --request POST https://fafmrvzpvackjyeonnfu.supabase.co/functions/v1/analyze-screen-time)"
          test "$status" = "401"
